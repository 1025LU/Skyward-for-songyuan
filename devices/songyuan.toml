[device]
codename = "songyuan"
brand = "Redmi"
model = "REDMI K100 Pro Max"
ab = true
soc = { hans = "第五代骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite Gen 5 行動平台", en = "Snapdragon® 8 Elite Gen 5 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# persist.sys.miui_resolution in the odm partition's build.prop.
width = 1200
height = 2608
density = 480

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: FocalTech's, over SPI behind Xiaomi's touch layer, the
# one touch driver the phone's own modules.load lists. The other two bring
# up the eSE the weaver below reads the card through.
load = ["focaltech_touch_3685g_1", "stm_st54se_gpio", "stm_nfc_i2c"]

# The eSE's own node, made by the modules above: the kernel creates it after
# the recovery's initial ueventd pass, so the HAL that opens it, running as
# system, would find it owned by root and its init would end with
# ESESTATUS_OPEN_FAILED. The installed vendor ueventd.rc gives it to system.
[[owners]]
user = "system"
group = "system"
mode = 0o660
paths = ["/dev/st54spi_gpio"]

# As on the 17 Ultra, the controller comes back from its reset sending raw
# frames for /odm/lib64/libtouchreport.so, which a recovery runs none of;
# told through Xiaomi's touch layer, the driver has it report positions.
# That is known of the 17 Ultra's Synaptics controller; whether FocalTech's
# answers the same switch is not yet tried.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# The firmware of the WLAN chip is on the modem partition, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# its own recovery leaves unmounted. The WLAN's MAC address is there.
[partitions]
mounted = ["persist"]

# Its stock recovery leaves out libsysutils and libcap, which the
# recovery's own logd loads, as the 17 Ultra's does.
[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts both CPU clusters on the performance governor, which holds them at
# their highest clock, and Qualcomm's idle driver keeps idle CPUs from
# powering down until it is told otherwise; the script hands the clusters
# to WALT, lets idle CPUs power down and sets how the memory bus scales.
# Without it the CPUs stay at their highest clock and voltage even while
# idle, and the phone slowly heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# WLAN: Qualcomm's Peach on PCIe (qcom,cnss-peach in its dtbo), as on the
# 17 Ultra, whose vendor partition this phone shares file for file but for
# its build properties, a power hint and three radio libraries.
# The TEE: qseecomd, which every key service below reaches the secure
# world through. The phone's own init starts it as vendor.qseecomd and
# waits on the same property.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# Gatekeeper: QTI's Rust service, asked under the name the framework
# gives it.
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-rust-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system"]

# The boot control HAL. init only starts the "default" and "hal" classes in a
# recovery, so this one, which the stock rc files declare as "early_hal", is
# never started, and fastbootd waits on android.hardware.boot.IBootControl
# before it opens the endpoint it serves fastboot over: it then sits there
# with the port on "none" and no computer sees the phone. Starting it here
# puts the interface there before the fastboot page can be reached.
[[service]]
path = "/system/bin/hw/android.hardware.boot-service.qti.recovery"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# KeyMint: the one key service on this phone, which serves the three
# interfaces below it from the same process.
[[service]]
path = "/vendor/bin/hw/android.hardware.security.onekeymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# StrongBox KeyMint (Thales) is left out: nothing the recovery does with a
# password goes through it, and it aborted every five seconds. It aborts
# because no configuration declares its IKeyMintDevice/strongbox
# description, and Skyward hands the service directory only the names
# listed in ready_service and registers (crates/skyward/src/main.rs:557).
# To bring it back, uncomment it with
#   ready_service = "android.hardware.security.keymint.IKeyMintDevice/strongbox"
# and first make sure a manifest under /vendor/etc/vintf/manifest or
# /odm/etc/vintf/manifest really describes it, or it aborts still and the
# ready wait spends its whole 20 seconds.
# [[service]]
# path = "/odm/bin/hw/android.hardware.security.keymint-service.strongbox-thales"
# libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64"]
# user = "vendor_thales_strongbox"
# groups = ["vendor_thales_strongbox"]

# The eSE: QTI's secure element HAL, which reads the card over the SPI
# node the modules above bring up.
[[service]]
path = "/vendor/bin/hw/android.hardware.secure_element-service.qti"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64"]
ready_service = "android.hardware.secure_element.ISecureElement/eSE1"
user = "system"
groups = ["system"]

# Weaver: Thales' implementation, which holds the secret a password is
# turned into a key with. Its place in this list matters: it comes after
# the eSE and before the bridge below, which finds this process in /proc
# by its path and takes its pid and uid before it acts.
[[service]]
path = "/odm/bin/hw/android.hardware.weaver-service.thales"
libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64"]
ready_service = "android.hardware.weaver.IWeaver/default"
user = "vendor_thales_weaver"
groups = ["vendor_thales_weaver", "system", "drmrpc"]

# miweaver, Xiaomi's authsecretd, is left out: it is oneshot, and a
# oneshot program that does not exit cleanly makes services::start() return
# Err for the whole list (crates/skyward/src/services.rs:63), so every
# service after it — weaver among them — never starts. That is why weaver
# has no start line of its own in the logs. Thales' weaver talks to the eSE
# and does not need it.
# [[service]]
# path = "/odm/bin/hw/vendor.xiaomi.hardware.authsecretd"
# libraries = ["/system/lib64", "/vendor/lib64", "/odm/lib64"]
# oneshot = true
# user = "system"
# groups = ["system", "drmrpc"]

[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's OS4.0.4.0,
# whose full update package on the phone maker's own download server holds
# the recovery partition the recovery is built on top of.
[stock]
version = "OS4.0.4.0.XGNCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.4.0.XGNCNXM/songyuan-ota_full-OS4.0.4.0.XGNCNXM-user-17.0-25df7572bd.zip"
recovery = "de8fcb7522ab6fd8b366b8bd6f0f2f5150d969a4c4d5ce04c61d1f87f6a2353d"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), with the click made from
# samples at the motor's resonant frequency as on the 17 Ultra. The
# strengths are the 17 Ultra's, which were felt on that phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }

